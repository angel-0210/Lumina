name: Lumina CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # PR VALIDATION JOB
  # ─────────────────────────────────────────────────────────────────────────
  validate-pr:
    name: Validate Pull Request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Backend setup & tests ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests (pytest)
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///:memory:
          SUPABASE_JWT_SECRET: testsecret_must_be_long_enough_to_be_secure_32_bytes_or_more
          GEMINI_API_KEY: mock_key
          CLOUDINARY_CLOUD_NAME: mock_cloud
          CLOUDINARY_API_KEY: mock_key
          CLOUDINARY_API_SECRET: mock_secret
          RATE_LIMIT_ENABLED: False
        run: |
          cd server
          python -m pytest

      # --- Frontend setup & checks ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Validate Web Bundle Build
        run: npx expo export

  # ─────────────────────────────────────────────────────────────────────────
  # MAIN BRANCH CHECKS & DEPLOYMENT JOB
  # ─────────────────────────────────────────────────────────────────────────
  main-checks:
    name: Main Branch Verification & Build checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///:memory:
          SUPABASE_JWT_SECRET: testsecret_must_be_long_enough_to_be_secure_32_bytes_or_more
          GEMINI_API_KEY: mock_key
          CLOUDINARY_CLOUD_NAME: mock_cloud
          CLOUDINARY_API_KEY: mock_key
          CLOUDINARY_API_SECRET: mock_secret
          RATE_LIMIT_ENABLED: False
        run: |
          cd server
          python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Assets (Production Bundle)
        run: npx expo export

      - name: Verify Docker Container Build
        run: |
          cd server
          docker build -t lumina-api:test -f Dockerfile .

  # ─────────────────────────────────────────────────────────────────────────
  # PRODUCTION EAS RELEASE JOB
  # ─────────────────────────────────────────────────────────────────────────
  release-eas:
    name: Build & Publish Release (EAS Build)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Setup Expo CLI and EAS CLI
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Triggers Android Release Build on EAS, waits for completion, and downloads the APK
      - name: Build Android APK
        id: build_apk
        run: |
          mkdir -p release
          TAG="${{ github.ref_name }}"
          echo "Building production APK for tag $TAG..."
          BUILD_JSON=$(npx eas build --platform android --profile production --non-interactive --json)
          echo "$BUILD_JSON" > release/build_result.json
          
          # Extract applicationArchiveUrl from JSON
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.applicationArchiveUrl')
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Error: Could not retrieve APK download URL from EAS build output."
            echo "EAS Build output:"
            cat release/build_result.json
            exit 1
          fi
          
          echo "Downloading APK from $APK_URL..."
          curl -L -o "release/Lumina-Android-$TAG.apk" "$APK_URL"

      # Validate that the downloaded APK file is non-empty and exists
      - name: Validate APK
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH="release/Lumina-Android-$TAG.apk"
          echo "Listing release directory:"
          ls -lh release/
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file does not exist at $APK_PATH"
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file at $APK_PATH is empty"
            exit 1
          fi
          
          echo "APK successfully built and validated at $APK_PATH"

      # Creates GitHub Release and uploads static web builds
      - name: Export Web Assets for Release
        run: npx expo export

      - name: Create Zip of Web Build
        run: zip -r lumina-web.zip dist/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lumina-web.zip
            release/Lumina-Android-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
