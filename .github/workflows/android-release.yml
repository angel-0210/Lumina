name: Lumina Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-eas:
    name: Build & Publish Release (EAS Build)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Setup Expo CLI and EAS CLI
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Triggers Android Release Build on EAS, waits for completion, and downloads the APK
      - name: Build Android APK
        id: build_apk
        run: |
          mkdir -p release
          TAG="${{ github.ref_name }}"
          echo "Building production APK for tag $TAG..."
          BUILD_JSON=$(npx eas build --platform android --profile production --non-interactive --json)
          echo "$BUILD_JSON" > release/build_result.json
          
          # Extract applicationArchiveUrl from JSON
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.applicationArchiveUrl')
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Error: Could not retrieve APK download URL from EAS build output."
            echo "EAS Build output:"
            cat release/build_result.json
            exit 1
          fi
          
          echo "Downloading APK from $APK_URL..."
          curl -L -o "release/Lumina-Android-$TAG.apk" "$APK_URL"

      # Validate that the downloaded APK file is non-empty and exists
      - name: Validate APK
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH="release/Lumina-Android-$TAG.apk"
          echo "Listing release directory:"
          ls -lh release/
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file does not exist at $APK_PATH"
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file at $APK_PATH is empty"
            exit 1
          fi
          
          echo "APK successfully built and validated at $APK_PATH"

      # Creates GitHub Release and uploads static web builds
      - name: Export Web Assets for Release
        run: npx expo export

      - name: Create Zip of Web Build
        run: zip -r lumina-web.zip dist/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lumina-web.zip
            release/Lumina-Android-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
