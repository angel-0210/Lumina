name: Lumina Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-eas:
    name: Build & Publish Release (EAS Build)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify Node
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN GitHub Secret is missing."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

      - name: Verify EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas --version
          eas whoami

      - name: Verify Expo project
        run: npx expo config --type public

      # Triggers Android Release Build on EAS, waits for completion, and downloads the APK
      - name: Build Android APK
        id: build_apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p release
          TAG="${{ github.ref_name }}"
          echo "Building production APK for tag $TAG..."
          RAW_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json 2>&1) || true
          echo "RAW EAS OUTPUT:"
          echo "$RAW_OUTPUT"
          echo "$RAW_OUTPUT" > release/build_result.json
          
          # Safely extract applicationArchiveUrl from JSON output using python regex
          APK_URL=$(python3 -c "import sys, json, re; raw=sys.stdin.read(); match=re.search(r'\[.*\]', raw, re.DOTALL); print(json.loads(match.group(0))[0]['artifacts']['applicationArchiveUrl']) if match else print('')" < release/build_result.json)
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Error: Could not retrieve APK download URL from EAS build output."
            echo "EAS Build output:"
            cat release/build_result.json
            exit 1
          fi
          
          echo "Downloading APK from $APK_URL..."
          curl -L -o "release/Lumina-Android-$TAG.apk" "$APK_URL"

      # Validate that the downloaded APK file is non-empty and exists
      - name: Validate APK
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH="release/Lumina-Android-$TAG.apk"
          echo "Listing release directory:"
          ls -lh release/
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file does not exist at $APK_PATH"
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file at $APK_PATH is empty"
            exit 1
          fi
          
          echo "APK successfully built and validated at $APK_PATH"

      # Creates GitHub Release and uploads static web builds
      - name: Export Web Assets for Release
        run: npx expo export

      - name: Create Zip of Web Build
        run: zip -r lumina-web.zip dist/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lumina-web.zip
            release/Lumina-Android-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
